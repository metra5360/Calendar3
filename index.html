<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Спільний календар</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Спільний календар</h1>
    <p id="today-date"></p>
    <div class="header-actions">
      <button type="button" id="theme-toggle" title="Перемкнути тему" aria-pressed="false">Темна тема</button>
      <button type="button" id="copy-link" title="Скопіювати посилання">Скопіювати посилання</button>
    </div>
  </header>

  <main>
    <div class="calendar">
      <div class="calendar-row header">
        <div class="day-label"></div>
        <div class="cell-header">Я</div>
        <div class="cell-header">Друг</div>
      </div>
      <div id="calendar-body"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
